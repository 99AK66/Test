<!DOCTYPE html> <html lang="th"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Omakase Reservation</title> <style> *{box-sizing:border-box} body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#0b0b0b; color:#fff; } .container{ max-width:430px; min-height:100vh; margin:auto; padding:25px 20px 35px; background:linear-gradient(160deg,#181818,#080808); } .logo{ text-align:center; font-size:42px; margin-top:10px; } h1{ text-align:center; margin:8px 0 4px; font-size:28px; } .subtitle{ text-align:center; color:#aaa; margin-bottom:28px; } .section{ margin-top:22px; } .title{ font-size:15px; color:#bbb; margin-bottom:9px; } .people{ background:#202020; border:1px solid #333; border-radius:14px; padding:15px; text-align:center; font-size:17px; } input{ width:100%; padding:15px; border-radius:14px; border:1px solid #444; background:#202020; color:white; font-size:16px; outline:none; } input:focus{ border-color:#d8b45a; } .times{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; } .time{ padding:14px 5px; text-align:center; border:1px solid #444; border-radius:12px; background:#1b1b1b; cursor:pointer; transition:.2s; } .time:hover{ border-color:#d8b45a; } .time.active{ background:#d8b45a; color:#111; border-color:#d8b45a; font-weight:bold; } .booking-card{ margin-top:25px; padding:18px; border-radius:16px; background:#151515; border:1px solid #333; } .row{ display:flex; justify-content:space-between; margin:9px 0; color:#bbb; } .row strong{ color:#fff; } .price{ margin-top:15px; padding-top:15px; border-top:1px solid #333; display:flex; justify-content:space-between; font-size:19px; } button{ width:100%; margin-top:20px; padding:16px; border:0; border-radius:14px; background:#d8b45a; color:#111; font-size:17px; font-weight:bold; cursor:pointer; } button:active{ transform:scale(.98); } .success{ display:none; margin-top:20px; padding:18px; border-radius:15px; background:#142016; border:1px solid #315d38; line-height:1.8; } .success h2{ margin:0 0 8px; font-size:20px; } </style> </head> <body> <div class="container"> <div class="logo">🍣</div> <h1>OMAKASE</h1> <div class="subtitle">Premium Japanese Dining</div> <div class="section"> <div class="title">จำนวนผู้เข้ารับบริการ</div> <div class="people">👥 2 ที่นั่ง</div> </div> <div class="section"> <div class="title">เลือกวันที่</div> <input type="date" id="date"> </div> <div class="section"> <div class="title">เลือกเวลา</div> <div class="times"> <div class="time" onclick="selectTime(this)">17:00</div> <div class="time" onclick="selectTime(this)">18:00</div> <div class="time" onclick="selectTime(this)">19:00</div> <div class="time" onclick="selectTime(this)">20:00</div> <div class="time" onclick="selectTime(this)">20:30</div> <div class="time" onclick="selectTime(this)">21:00</div> </div> </div> <div class="section"> <div class="title">ชื่อผู้จอง</div> <input type="text" id="name" placeholder="กรอกชื่อผู้จอง"> </div> <div class="booking-card"> <div class="row"> <span>จำนวน</span> <strong>2 ท่าน</strong> </div> <div class="row"> <span>วันที่</span> <strong id="showDate">-</strong> </div> <div class="row"> <span>เวลา</span> <strong id="showTime">-</strong> </div> <div class="price"> <span>Omakase</span> <strong>฿5,980</strong> </div> </div> <button onclick="confirmBooking()"> ยืนยันการจอง </button> <div class="success" id="success"> <h2>✅ จองสำเร็จ</h2> <div id="bookingInfo"></div> </div> </div> <script> let selectedTime = ""; const dateInput = document.getElementById("date"); const today = new Date(); const yyyy = today.getFullYear(); const mm = String(today.getMonth()+1).padStart(2,"0"); const dd = String(today.getDate()).padStart(2,"0"); dateInput.min = `${yyyy}-${mm}-${dd}`; dateInput.addEventListener("change",function(){ document.getElementById("showDate").textContent = this.value || "-"; }); function selectTime(element){ document .querySelectorAll(".time") .forEach(function(item){ item.classList.remove("active"); }); element.classList.add("active"); selectedTime = element.textContent; document.getElementById("showTime").textContent = selectedTime; } function confirmBooking(){ const date = dateInput.value; const name = document .getElementById("name") .value .trim(); if(!date){ alert("กรุณาเลือกวันที่"); return; } if(!selectedTime){ alert("กรุณาเลือกเวลา"); return; } if(!name){ alert("กรุณากรอกชื่อผู้จอง"); return; } document.getElementById("bookingInfo").innerHTML = ` 👤 ผู้จอง: <strong>${escapeHTML(name)}</strong><br> 👥 จำนวน: <strong>2 ท่าน</strong><br> 📅 วันที่: <strong>${date}</strong><br> 🕐 เวลา: <strong>${selectedTime} น.</strong><br> 🍣 ราคา: <strong>฿5,980</strong> `; document.getElementById("success").style.display = "block"; document.getElementById("success") .scrollIntoView({ behavior:"smooth", block:"center" }); } function escapeHTML(text){ const div = document.createElement("div"); div.textContent = text; return div.innerHTML; } </script> </body> </html>
