<!DOCTYPE html> <html lang="th"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>นัดหมายบริจาคโลหิต</title> <style> *{box-sizing:border-box} body{ margin:0; font-family:system-ui,-apple-system,sans-serif; background:#f5f6f8; color:#222; } .app{ max-width:500px; margin:auto; min-height:100vh; background:white; padding-bottom:30px; } .header{ background:linear-gradient(135deg,#c62828,#e53935); color:white; padding:25px 20px; border-radius:0 0 25px 25px; } .header h1{ margin:0; font-size:24px; } .header p{ margin:6px 0 0; opacity:.9; } .content{ padding:20px; } label{ display:block; font-weight:600; margin-bottom:8px; } input{ width:100%; padding:13px; border:1px solid #ddd; border-radius:12px; font-size:16px; margin-bottom:20px; } .section-title{ font-size:18px; font-weight:700; margin:10px 0 15px; } .legend{ display:flex; justify-content:center; gap:18px; font-size:13px; margin-bottom:18px; } .dot{ width:12px; height:12px; display:inline-block; border-radius:50%; margin-right:4px; } .available{background:#4caf50} .selected{background:#e53935} .busy{background:#bdbdbd} .room{ background:#f7f7f7; border-radius:18px; padding:20px 10px; } .screen{ background:#333; color:white; text-align:center; padding:8px; border-radius:8px; margin:0 20px 25px; font-size:13px; } .seats{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; } .seat{ height:65px; border:2px solid #4caf50; background:white; border-radius:13px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:.2s; } .seat span{ font-size:12px; margin-top:3px; } .seat:hover{ transform:translateY(-2px); } .seat.selected{ background:#e53935; border-color:#e53935; color:white; } .seat.busy{ background:#e0e0e0; border-color:#bdbdbd; color:#888; cursor:not-allowed; } .summary{ margin-top:20px; padding:18px; background:#fff5f5; border:1px solid #ffcdd2; border-radius:15px; } .summary-row{ display:flex; justify-content:space-between; margin:7px 0; } button{ width:100%; margin-top:20px; padding:15px; border:0; border-radius:14px; background:#c62828; color:white; font-size:17px; font-weight:bold; cursor:pointer; } button:disabled{ background:#ccc; } .success{ display:none; margin-top:20px; padding:18px; border-radius:15px; background:#e8f5e9; color:#1b5e20; } </style> </head> <body> <div class="app"> <div class="header"> <h1>🩸 นัดหมายบริจาคโลหิต</h1> <p>เลือกวัน เวลา และจุดรับบริการ</p> </div> <div class="content"> <label>วันที่ต้องการบริจาค</label> <input type="date" id="date"> <div class="section-title"> 🕐 เลือกเวลา </div> <div class="legend"> <span><i class="dot available"></i>ว่าง</span> <span><i class="dot selected"></i>เลือก</span> <span><i class="dot busy"></i>เต็ม</span> </div> <div class="room"> <div class="screen"> 🏥 จุดรับบริจาคโลหิต </div> <div class="seats" id="seats"></div> </div> <div class="summary"> <div class="summary-row"> <span>📅 วันที่</span> <strong id="showDate">-</strong> </div> <div class="summary-row"> <span>🕐 เวลา</span> <strong id="showTime">-</strong> </div> <div class="summary-row"> <span>💺 จุดบริการ</span> <strong id="showSeat">-</strong> </div> </div> <button id="confirm" onclick="confirmBooking()" disabled> ยืนยันนัดหมาย </button> <div class="success" id="success"></div> </div> </div> <script> const times = [ "09:00","09:30", "10:00","10:30", "11:00","11:30", "13:00","13:30", "14:00","14:30", "15:00","15:30" ]; let selected = null; let selectedDate = ""; const seats = document.getElementById("seats"); times.forEach((time,index)=>{ const div = document.createElement("div"); div.className = "seat"; /* จำลองบางช่วงเวลาที่เต็ม ภายหลังสามารถเปลี่ยนเป็นข้อมูลจาก Google Sheets ได้ */ if(index === 3 || index === 8){ div.classList.add("busy"); div.innerHTML = ` 🩸 <span>${time}</span> `; }else{ div.innerHTML = ` 🩸 <span>${time}</span> `; div.onclick = function(){ document .querySelectorAll(".seat") .forEach(x=>x.classList.remove("selected")); this.classList.add("selected"); selected = time; document.getElementById("showTime") .textContent = time + " น."; checkReady(); }; } seats.appendChild(div); }); document.getElementById("date").addEventListener("change",function(){ selectedDate = this.value; document.getElementById("showDate") .textContent = selectedDate || "-"; checkReady(); }); function checkReady(){ document.getElementById("confirm").disabled = !(selectedDate && selected); } function confirmBooking(){ if(!selectedDate || !selected){ alert("กรุณาเลือกวันและเวลา"); return; } document.getElementById("success").style.display = "block"; document.getElementById("success").innerHTML = ` <strong>✅ นัดหมายสำเร็จ</strong><br><br> 📅 วันที่ ${selectedDate}<br> 🕐 เวลา ${selected} น.<br> 🩸 กรุณามาถึงก่อนเวลานัดประมาณ 10 นาที `; document.getElementById("success") .scrollIntoView({ behavior:"smooth" }); } </script> </body> </html>
