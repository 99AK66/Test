<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your OTP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Inter", sans-serif;
            background: #e7ebf0;
            overflow: hidden;
            margin: 0;
        }

        .container {
            position: relative;
            width: 420px;
            padding: 45px 35px;
            border-radius: 35px;
            background: #e7ebf0;
            box-shadow: 
                20px 20px 40px rgba(163, 177, 198, 0.65),
                -20px -20px 40px rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Lock Icon */
        .icon-container {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #e7ebf0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            box-shadow: 
                inset 6px 6px 12px rgba(163, 177, 198, 0.5),
                inset -6px -6px 12px rgba(255, 255, 255, 0.8);
        }

        .icon-container svg {
            width: 30px;
            height: 30px;
            fill: #d4a373;
        }

        /* Text Styles */
        h2 {
            font-size: 24px;
            font-weight: 700;
            color: #2d3748;
            margin: 0 0 10px 0;
        }

        p.subtitle {
            font-size: 14px;
            color: #718096;
            margin: 0 0 5px 0;
        }

        p.phone {
            font-size: 15px;
            font-weight: 600;
            color: #2d3748;
            margin: 0 0 30px 0;
        }

        /* OTP Input Boxes */
        .otp-inputs {
            display: flex;
            gap: 12px;
            margin-bottom: 35px;
        }

        .otp-input {
            width: 45px;
            height: 55px;
            border: none;
            outline: none;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: #2d3748;
            border-radius: 12px;
            background: #e7ebf0;
            box-shadow: 
                inset 4px 4px 8px rgba(163, 177, 198, 0.5),
                inset -4px -4px 8px rgba(255, 255, 255, 0.8);
            transition: all 0.2s ease;
        }

        /* ช่องสุดท้ายทำไฮไลต์สีฟ้าอ่อนตามภาพต้นฉบับ */
        .otp-input.active {
            box-shadow: 
                inset 3px 3px 6px rgba(163, 177, 198, 0.4),
                inset -3px -3px 6px rgba(255, 255, 255, 0.8),
                0 0 0 2px rgba(66, 153, 225, 0.6);
            color: #3182ce;
        }

        /* Verify Button */
        .verify-btn {
            width: 100%;
            padding: 16px;
            border: none;
            outline: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 
                6px 6px 15px rgba(163, 177, 198, 0.5),
                -6px -6px 15px rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            margin-bottom: 25px;
        }

        .verify-btn:active {
            transform: scale(0.98);
        }

        /* Resend Timer Text */
        .resend-text {
            font-size: 13px;
            color: #718096;
        }

        .resend-text span {
            color: #4a5568;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ไอคอนกุญแจ -->
        <div class="icon-container">
            <svg viewBox="0 0 24 24">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
        </div>

        <!-- หัวข้อ -->
        <h2>Verify Your OTP</h2>
        <p class="subtitle">We've sent a 6-digit verification code to</p>
        <p class="phone">+91 XXXXX 00945</p>

        <!-- ช่องกรอก OTP (ใส่ตัวเลขจำลองตามรูป) -->
        <div class="otp-inputs">
            <input type="text" class="otp-input" maxlength="1" value="2">
            <input type="text" class="otp-input" maxlength="1" value="3">
            <input type="text" class="otp-input" maxlength="1" value="4">
            <input type="text" class="otp-input" maxlength="1" value="2">
            <input type="text" class="otp-input" maxlength="1" value="3">
            <input type="text" class="otp-input active" maxlength="1" value="4">
        </div>

        <!-- ปุ่ม Verify -->
        <button class="verify-btn">
            VERIFY OTP &rarr;
        </button>

        <!-- ข้อความส่งซ้ำ -->
        <p class="resend-text">Resend OTP in <span>25 seconds</span></p>
    </div>

</body>
</html>
